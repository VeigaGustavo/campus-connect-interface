# Opção B: build no GitHub Actions, deploy na Vercel.
#
# Uma vez no repo (commitar .vercel/project.json):
#   npm i -g vercel && vercel login && vercel link
#
# GitHub → Secrets → VERCEL_TOKEN (https://vercel.com/account/tokens)

name: Deploy Web (Vercel)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: deploy-vercel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Vercel CLI
        run: npm install -g vercel@latest

      - name: Build Flutter web
        run: bash scripts/build-web.sh

      - name: Deploy na Vercel
        run: |
          set -euo pipefail
          ARGS=(--yes --token "${{ secrets.VERCEL_TOKEN }}")
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ARGS+=(--prod)
          fi
          vercel deploy build/web "${ARGS[@]}"
